<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcio Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--ink:#12202b;--mute:#5d6d78;--card:#fff;--line:#d5dde2;--accent:#0f7a4d;--hot:#d9480f;--cold:#1c6bb0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a22;--ink:#e8eef2;--mute:#8fa1ad;--card:#16262f;--line:#2a3d49;--accent:#3ecf8e;--hot:#ff8a5c;--cold:#6cb6ff}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
header{display:flex;align-items:baseline;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;font-weight:800;font-size:1.25rem}
header span{color:var(--mute);font-size:.85rem}
main{max-width:1100px;margin:0 auto;padding:1.25rem}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;margin:.5rem 0 1.5rem;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:1.75rem 0 .6rem}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}
.picker a{display:block;padding:1.4rem 1.2rem;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;font-weight:600;font-size:1.15rem}
.picker a:hover,.picker a:focus-visible{border-color:var(--accent);outline:none}
nav.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 1rem}
nav.tabs a,.seg button{padding:.45rem .9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;text-decoration:none;font:inherit;font-size:.9rem;cursor:pointer}
nav.tabs a.on,.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:.4rem;margin:.5rem 0}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:.5rem .7rem;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
th.on{color:var(--ink)}
tr:last-child td{border-bottom:0}
.best{color:var(--accent);font-weight:800}.worst{color:var(--hot);font-weight:800}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem}
.leaders div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .85rem}
.leaders small{display:block;color:var(--mute)}.leaders b{font-size:1.05rem}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;padding:.55rem .8rem;border-bottom:1px solid var(--line);align-items:center}
.res:last-child{border-bottom:0}.res .s{font-weight:800;font-size:1.05rem}.res .h{text-align:right}
.res .m{grid-column:1/-1;color:var(--mute);font-size:.78rem;text-align:center}
.note{color:var(--mute);font-size:.82rem;margin-top:.6rem}
.err{padding:1rem;background:var(--card);border:1px solid var(--hot);border-radius:6px}
header{position:sticky;top:0;background:var(--bg);z-index:5}
header a.back{font-size:.85rem;font-weight:600;border:1px solid var(--line);padding:.35rem .8rem;border-radius:999px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem;margin-bottom:.8rem}
.card h3{margin:0 0 .3rem;font-size:1.05rem}.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.card ul{margin:.3rem 0;padding-left:1.1rem}.f{color:var(--accent)}.w{color:var(--hot)}
.pk{border-left:3px solid var(--accent);padding-left:.7rem;margin:.5rem 0}.pk.u{border-color:var(--cold)}
.det{padding:.4rem .8rem .8rem;border-bottom:1px solid var(--line)}.det table{max-width:420px;margin:0 auto}.det td{text-align:center}
select{font:inherit;padding:.3rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.tl{margin:.6rem 0}.tl .lane{position:relative;height:1.6rem}.tl i{position:absolute;transform:translateX(-50%);font-style:normal;cursor:default}
.tl .axis{display:flex;justify-content:space-between;border-top:1px solid var(--line);font-size:.7rem;color:var(--mute)}
details.card>summary{cursor:pointer;font-size:1.05rem}
</style>
</head>
<body>
<header><a href="#/" class="back">← Campionati</a><a href="#/">Calcio Stats</a><span id="upd"></span></header>
<main id="app"></main>
<script>
const LEAGUES=[["serie-a","Serie A"],["premier-league","Premier League"],["bundesliga","Bundesliga"],["la-liga","La Liga"],["ligue-1","Ligue 1"]];
// metrica: [chiave, intestazione, descrizione, meglio = "high"|"low"|null]
const COLS=[["gfm","Gol F","Gol fatti a partita","high"],["gam","Gol S","Gol subiti a partita","low"],
["sf","Tiri F","Tiri fatti a partita","high"],["sa","Tiri S","Tiri concessi a partita","low"],
["tf","In porta F","Tiri in porta fatti","high"],["ta","In porta S","Tiri in porta concessi","low"],
["cf","Angoli F","Calci d’angolo fatti","high"],["ca","Angoli S","Calci d’angolo concessi","low"],
["fc","Falli F","Falli fatti","low"],["fs","Falli S","Falli subiti","high"],
["y","Gialli","Gialli presi a partita","low"],["r","Rossi","Rossi presi a partita","low"]];
const app=document.getElementById("app");
const st={sort:"gfm",dir:-1,venue:"tot",cache:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=v=>v==null?"–":v;

async function load(slug){
  if(!st.cache[slug]){const r=await fetch(`data/${slug}.json`);if(!r.ok)throw new Error("Dati non disponibili");st.cache[slug]=await r.json();}
  return st.cache[slug];
}
function home(){
  document.getElementById("upd").textContent="";
  app.innerHTML=`<h1>Scegli il campionato</h1><div class="picker">${LEAGUES.map(([s,n])=>`<a href="#/${s}/classifica">${n}</a>`).join("")}</div>`;
}
function classifica(d){
  const rows=d.classifica.map((t,i)=>`<tr><td>${i+1}. ${esc(t.squadra)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}:${t.ga}</td><td>${t.gf-t.ga>0?"+":""}${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join("");
  const res=d.ultima_giornata.map(m=>`<div class="res"><span class="h">${esc(m.home)}</span><span class="s">${m.hg} – ${m.ag}</span><span>${esc(m.away)}</span><span class="m">${m.date.split("-").reverse().join("/")}${m.ref?` · arbitro ${esc(m.ref)}`:""}${m.hc!=null?` · angoli ${m.hc}-${m.ac} · tiri ${m.hs}-${m.as_}`:""}</span></div>`).join("");
  return `<h2>Classifica</h2><div class="wrap"><table><tr><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>Gol</th><th>DR</th><th>Pt</th></tr>${rows}</table></div>
  <h2>Ultima giornata giocata</h2><div class="wrap">${res||"<p class='note' style='padding:1rem'>Nessuna partita ancora giocata.</p>"}</div>
  <p class="note">Le partite mostrate sono le ultime ${d.ultima_giornata.length} disputate.</p>`;
}
function squadre(d){
  const names=Object.keys(d.squadre);
  const val=(n,k)=>d.squadre[n][st.venue][k];
  const leaders=COLS.filter(c=>c[3]).map(([k,h,desc,best])=>{
    const ok=names.filter(n=>val(n,k)!=null);if(!ok.length)return"";
    ok.sort((a,b)=>best==="high"?val(b,k)-val(a,k):val(a,k)-val(b,k));
    return `<div><small>${desc}: la migliore</small><b>${esc(ok[0])}</b> ${val(ok[0],k)}</div>`;}).join("");
  const sorted=[...names].sort((a,b)=>st.sort==="nome"?a.localeCompare(b)*-st.dir:((val(a,st.sort)??-1)-(val(b,st.sort)??-1))*st.dir);
  const rank={};COLS.forEach(([k,,,best])=>{if(!best)return;const v=names.map(n=>val(n,k)).filter(x=>x!=null);rank[k]=[Math.min(...v),Math.max(...v)];});
  const cls=(k,v,best)=>{if(v==null||!best)return"";const[mn,mx]=rank[k];if(mn===mx)return"";const g=best==="high"?mx:mn,b=best==="high"?mn:mx;return v===g?"best":v===b?"worst":"";};
  const head=COLS.map(([k,h,desc])=>`<th data-k="${k}" title="${desc}" class="${st.sort===k?"on":""}">${h}${st.sort===k?(st.dir<0?" ↓":" ↑"):""}</th>`).join("");
  const body=sorted.map(n=>`<tr><td>${esc(n)} <small style="color:var(--mute)">(${d.squadre[n][st.venue].p})</small></td>${COLS.map(([k,,,best])=>{const v=val(n,k);return `<td class="${cls(k,v,best)}">${f(v)}</td>`}).join("")}</tr>`).join("");
  const V=[["tot","Totale"],["casa","Casa"],["fuori","Fuori"]];
  return `<h2>Le migliori del campionato</h2><div class="leaders">${leaders}</div>
  <h2>Medie a partita</h2><div class="seg">${V.map(([k,n])=>`<button data-v="${k}" class="${st.venue===k?"on":""}">${n}</button>`).join("")}</div>
  <div class="wrap"><table><tr><th data-k="nome" class="${st.sort==="nome"?"on":""}">Squadra (partite)</th>${head}</tr>${body}</table></div>
  <p class="note">F = fatti, S = subiti/concessi. Verde = miglior valore del campionato, arancione = peggiore. Clicca un’intestazione per ordinare. Con poche partite le medie sono instabili: guarda sempre il numero tra parentesi.</p>`;
}

const TABS=[["prossima","Prossima giornata"],["giocate","Giocate"],["risultati","Risultati"],["giocatori","Giocatori"],["classifica","Classifica"],["squadre","Squadre"]];
function tabs(slug,tab){return `<nav class="tabs">${TABS.map(([k,n])=>`<a href="#/${slug}/${k}" class="${k===tab?"on":""}">${n}</a>`).join("")}</nav>`;}
const lavg=(d,k)=>{const a=Object.values(d.squadre).map(t=>t.tot[k]).filter(x=>x!=null);return a.reduce((s,x)=>s+x,0)/(a.length||1)};
const mix=(x,y)=>(x+y)/2, r1=x=>Math.round(x*10)/10, dt=m=>m.date.split("-").reverse().join("/")+(m.time?" "+m.time:"");
function refOf(slug,m){let v=m.ref||"";try{v=localStorage.getItem(`ref:${slug}:${m.home}:${m.away}`)??v}catch(e){}return v;}
function analyze(d,slug,m){
  const H=d.squadre[m.home]?.tot,A=d.squadre[m.away]?.tot;
  if(!H||!A)return null;
  const ok=Math.min(H.ps,A.ps)>=4,picks=[];
  const add=(name,e,b,x)=>{if(!b)return;const edge=e/b-1;if(Math.abs(edge)>=.12)picks.push({name,e:r1(e),b:r1(b),edge,over:edge>0,strong:Math.abs(edge)>=.2,m,...x});};
  const R=d.arbitri.find(a=>a.arbitro===refOf(slug,m)),by=2*lavg(d,"y");let fac=1;
  if(ok){
    [[m.home,H,A],[m.away,A,H]].forEach(([n,X,Y])=>{
      add(`Tiri ${n}`,mix(X.sf,Y.sa),lavg(d,"sf"));add(`Tiri in porta ${n}`,mix(X.tf,Y.ta),lavg(d,"tf"));
      add(`Angoli ${n}`,mix(X.cf,Y.ca),lavg(d,"cf"));add(`Gol ${n}`,mix(X.gfm,Y.gam),lavg(d,"gfm"));});
    add("Falli totali del match",mix(H.fc,A.fs)+mix(A.fc,H.fs),2*lavg(d,"fc"));
    let ye=H.y+A.y;if(R){const w=R.g/(R.g+3);fac=1+(R.gialli/by-1)*w;ye*=fac;}
    add("Ammonizioni totali del match",ye,by,{ref:R});
  }
  picks.sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge));
  return{H,A,ok,picks,R,fac};
}
const pickLi=(p,full)=>`<div class="pk ${p.over?"":"u"}"><b>${p.over?"Over":"Under"} · ${esc(p.name)}</b>${p.strong?" · segnale forte":""}<br><small>${full?esc(p.m.home)+"–"+esc(p.m.away)+" · ":""}stima ${p.e} contro media campionato ${p.b} (${p.edge>0?"+":""}${Math.round(p.edge*100)}%). Confronta con la linea del bookmaker.</small></div>`;
const SW=[["gfm","attacco prolifico","attacco poco prolifico",1],["gam","difesa solida","difesa che subisce molto",-1],["sf","tira molto","tira poco",1],["sa","concede pochi tiri","concede molti tiri",-1],["tf","molti tiri in porta","pochi tiri in porta",1],["ta","concede pochi tiri in porta","concede molti tiri in porta",-1],["cf","molti angoli","pochi angoli",1],["ca","concede pochi angoli","concede molti angoli",-1]];
function sw(d,team){const nm=Object.keys(d.squadre),F=[],W=[];
  SW.forEach(([k,s,w,dir])=>{const v=nm.filter(n=>d.squadre[n].tot[k]!=null).sort((a,b)=>(d.squadre[b].tot[k]-d.squadre[a].tot[k])*dir),i=v.indexOf(team);
    if(i<0)return;if(i<3)F.push(`${s} (${i+1}°)`);else if(i>=v.length-3)W.push(`${w} (${v.length-i}° peggiore)`);});
  return{F,W};}
const forma=(d,t)=>d.partite.filter(m=>m.home===t||m.away===t).slice(-5).map(m=>{const g=m.home===t?m.hg-m.ag:m.ag-m.hg;return g>0?"V":g<0?"P":"N"}).join(" ")||"–";
const empty=t=>`<div class="err">${t}</div>`;
function prossima(d,slug){
  if(!d.prossima_giornata?.length)return empty("Calendario non disponibile: la fonte non ha partite future per questo campionato. Riprova dopo il prossimo aggiornamento.");
  return d.prossima_giornata.map(m=>{const a=analyze(d,slug,m);if(!a)return`<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3>Squadre non trovate nei dati.</div>`;
    const sh=sw(d,m.home),sa=sw(d,m.away),li=x=>x.length?x.map(t=>`<li>${t}</li>`).join(""):"<li>nessun dato estremo</li>";
    return `<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3><small>${dt(m)}</small>
    <div class="cols"><div><b>${esc(m.home)}</b> · forma ${forma(d,m.home)}<ul class="f">${li(sh.F)}</ul><ul class="w">${li(sh.W)}</ul></div>
    <div><b>${esc(m.away)}</b> · forma ${forma(d,m.away)}<ul class="f">${li(sa.F)}</ul><ul class="w">${li(sa.W)}</ul></div></div>
    <b>Come si incontrano</b>${a.ok?(a.picks.filter(p=>!p.name.startsWith("Ammon")).slice(0,3).map(p=>pickLi(p)).join("")||"<p class='note'>Nessuno scontro netto tra punti di forza e di debolezza.</p>"):"<p class='note'>Poche partite per un confronto affidabile.</p>"}</div>`;}).join("")+`<p class="note">Elenco verde = punti di forza (primi 3 del campionato), arancione = punti deboli (ultimi 3). Forma: ultime 5 partite, dalla più vecchia.</p>`;
}
function giocate(d,slug){
  if(!d.prossima_giornata?.length)return empty("Calendario non disponibile: senza le prossime partite non posso calcolare le giocate.");
  const all=d.prossima_giornata.map(m=>({m,a:analyze(d,slug,m)})).filter(x=>x.a);
  const top=all.flatMap(x=>x.a.picks).slice().sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge)).slice(0,8);
  const refs=[...d.arbitri].sort((a,b)=>a.arbitro.localeCompare(b.arbitro));
  const cards=all.map(({m,a})=>{
    const cur=refOf(slug,m),sel=`<select data-ref="${esc(m.home)}|${esc(m.away)}"><option value="">Arbitro non ancora designato</option>${refs.map(r=>`<option ${r.arbitro===cur?"selected":""}>${esc(r.arbitro)}</option>`).join("")}</select>`;
    let note="";
    if(a.R){const hi=a.H.y>=a.A.y?m.home:m.away;
      note=`<p>Arbitro <b>${esc(a.R.arbitro)}</b>: ${a.R.gialli} gialli a partita in ${a.R.g} partite (media campionato ${r1(2*lavg(d,"y"))}).`+
      (a.fac>=1.12?` <b class="w">Arbitro severo</b>: valuta Over ammonizioni sul match; la squadra che ne prende di più è ${esc(hi)}.`:a.fac<=.88?` <b class="f">Arbitro di manica larga</b>: valuta Under ammonizioni.`:" Nessuna spinta netta sulle ammonizioni.")+
      `</p>`;}
    else note=`<p class="note">Scegli l’arbitro per far entrare le ammonizioni nel calcolo (la designazione esce un paio di giorni prima).</p>`;
    return `<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3><small>${dt(m)}</small><p>${sel}</p>${note}${gioc(d,m,a)}${a.ok?(a.picks.map(p=>pickLi(p)).join("")||"<p class='note'>Nessuna giocata con scarto netto.</p>"):"<p class='note'>Meno di 4 partite con statistiche per una delle squadre: nessuna giocata.</p>"}</div>`;}).join("");
  return `<h2>Le giocate più nette della giornata</h2><div class="card">${top.map(p=>pickLi(p,1)).join("")||"Nessuna giocata con scarto netto."}</div><h2>Partita per partita</h2>${cards}
  <p class="note">La stima mescola quanto la squadra fa di solito e quanto l’avversaria concede, confrontata con la media del campionato. Sono tendenze statistiche, non probabilità: contano solo se la linea del bookmaker è più bassa (Over) o più alta (Under) della stima. L’effetto dell’arbitro è attenuato quando ha pochi match.</p>`;
}
function risultatiOld(d){
  if(!d.ultima_giornata.length)return empty("Nessuna partita ancora giocata.");
  const row=(l,a,b)=>`<tr><td>${a??"–"}</td><td>${l}</td><td>${b??"–"}</td></tr>`;
  return `<div class="wrap">${d.ultima_giornata.map(m=>`<div class="res" data-open style="cursor:pointer"><span class="h">${esc(m.home)}</span><span class="s">${m.hg} – ${m.ag}</span><span>${esc(m.away)}</span><span class="m">${dt(m)} · tocca per le statistiche</span></div>
  <div class="det" hidden><table>${row("Tiri",m.hs,m.as_)}${row("Tiri in porta",m.hst,m.ast)}${row("Angoli",m.hc,m.ac)}${row("Falli",m.hf,m.af)}${row("Gialli",m.hy,m.ay)}${row("Rossi",m.hr,m.ar)}</table><p class="note" style="text-align:center">Arbitro: ${m.ref?esc(m.ref):"non indicato"}</p></div>`).join("")}</div>`;
}
async function route(){
  const [,slug,tab="prossima"]=location.hash.split("/");
  if(!slug)return home();
  const lg=LEAGUES.find(l=>l[0]===slug);if(!lg)return home();
  app.innerHTML=`<h1>${lg[1]}</h1>${tabs(slug,tab)}<p class="note">Caricamento…</p>`;
  try{
    const d=await load(slug);const E=await loadE(slug);d.espn=E;if(E&&E.prossima&&E.prossima.length)d.prossima_giornata=E.prossima;
    document.getElementById("upd").textContent=`Stagione ${d.stagione.slice(0,2)}/${d.stagione.slice(2)} · aggiornato ${d.aggiornato.replace("T"," ").slice(0,16)} UTC`;
    const view={prossima,giocate,risultati,giocatori,classifica,squadre}[tab]||prossima;
    app.innerHTML=`<h1>${lg[1]}</h1>${tabs(slug,tab)}${view(d,slug)}`;
    app.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=k==="nome"?-1:(COLS.find(c=>c[0]===k)[3]==="low"?1:-1);}route();});
    app.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{st.venue=b.dataset.v;route();});
    bindExtra();app.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{el.nextElementSibling.hidden=!el.nextElementSibling.hidden;});
    app.querySelectorAll("select[data-ref]").forEach(s=>s.onchange=()=>{try{localStorage.setItem(`ref:${slug}:${s.dataset.ref.replace("|",":")}`,s.value)}catch(e){}route();});
  }catch(e){
    app.innerHTML=`<h1>${lg[1]}</h1>${tabs(slug,tab)}<div class="err">Dati non disponibili per questo campionato. Lancia l’azione “Aggiorna dati” su GitHub e ricarica.</div>`;
  }
}

async function loadE(slug){const k="e:"+slug;if(!(k in st.cache)){try{const r=await fetch(`data/${slug}-espn.json`);st.cache[k]=r.ok?await r.json():null}catch(e){st.cache[k]=null}}return st.cache[k];}
const fmtMin=m=>{const x=/(\d+)(?:\D+(\d+))?/.exec(m||"");return x?+x[1]+(x[2]?+x[2]/100:0):0};
const IC={gol:"⚽",giallo:"🟨",rosso:"🟥"};
function matchDetail(d,m){
  const fm=d.partite.find(x=>x.date===m.date&&x.home===m.home&&x.away===m.away);
  const row=(l,a,b)=>`<tr><td>${a??"–"}</td><td>${l}</td><td>${b??"–"}</td></tr>`;
  const ev=[...(m.eventi||[])].sort((a,b)=>fmtMin(a.min)-fmtMin(b.min));
  const lane=t=>ev.filter(e=>e.squadra===t).map(e=>`<i title="${esc(e.min+" "+(e.g||"")+(e.a?" (assist "+e.a+")":""))}" style="left:${Math.min(100,fmtMin(e.min)/95*100)}%">${IC[e.tipo]}</i>`).join("");
  const arb=m.arbitro_n||(m.arbitri&&m.arbitri[0]&&m.arbitri[0].nome)||"non indicato";
  return `<div class="det"${m.__open?"":" hidden"}>${m.det?`<div class="tl"><small>${esc(m.home)}</small><div class="lane">${lane(m.home)}</div><div class="axis"><span>0'</span><span>45'</span><span>90'</span></div><div class="lane">${lane(m.away)}</div><small>${esc(m.away)}</small></div>
  <ul>${ev.map(e=>`<li>${esc(e.min)} ${IC[e.tipo]} <b>${esc(e.g||"?")}</b>${e.a?` (assist ${esc(e.a)})`:""}${e.extra?` · ${e.extra}`:""} <small>${esc(e.squadra||"")}</small></li>`).join("")||"<li>Nessun gol né cartellino</li>"}</ul>`:"<p class='note'>Cronaca non ancora disponibile.</p>"}
  ${fm?`<table>${row("Tiri",fm.hs,fm.as_)}${row("Tiri in porta",fm.hst,fm.ast)}${row("Angoli",fm.hc,fm.ac)}${row("Falli",fm.hf,fm.af)}${row("Gialli",fm.hy,fm.ay)}${row("Rossi",fm.hr,fm.ar)}</table>`:""}
  <p class="note" style="text-align:center">Arbitro: ${esc(arb)}</p></div>`;
}
function risultati(d){
  const E=d.espn;if(!E||!E.partite)return risultatiOld(d);
  const pl=E.partite.filter(m=>m.stato==="post");if(!pl.length)return empty("Nessuna partita ancora giocata.");
  const gs=[...new Set(pl.map(m=>m.g))].sort((a,b)=>b-a);
  return gs.map((g,i)=>`<details class="card" ${i===0?"open":""}><summary><b>Giornata ${g}</b></summary>${pl.filter(m=>m.g===g).map(m=>{m.__open=i===0;return `<div class="res" data-open style="cursor:pointer"><span class="h">${esc(m.home)}</span><span class="s">${m.hg} – ${m.ag}</span><span>${esc(m.away)}</span><span class="m">${dt(m)}</span></div>${matchDetail(d,m)}`}).join("")}</details>`).join("");
}
function giocatori(d){
  const E=d.espn;if(!E||!E.giocatori||!E.giocatori.length)return empty("Dati dei giocatori non disponibili: nella scheda Actions controlla che “Aggiorna dati” sia verde e che il passaggio ESPN non dia errori.");
  const K=[["sh","Tiri"],["sot","In porta"],["g","Gol"],["a","Assist"],["fc","Falli F"],["fs","Falli S"],["y","Gialli"],["r","Rossi"]];
  const sq=[...new Set(E.giocatori.map(p=>p.sq))].sort(),F=st.pteam||"",sk=st.psort||"sh";
  const v=(p,k)=>st.pg?p[k]/p.p:p[k];
  const L=E.giocatori.filter(p=>p.p>=2&&(!F||p.sq===F)).sort((a,b)=>v(b,sk)-v(a,sk)).slice(0,100);
  const fx=x=>st.pg?(Math.round(x*100)/100):x;
  return `<div class="seg"><select data-pt><option value="">Tutte le squadre</option>${sq.map(s=>`<option ${s===F?"selected":""}>${esc(s)}</option>`).join("")}</select>
  <button data-pg="0" class="${st.pg?"":"on"}">Totali</button><button data-pg="1" class="${st.pg?"on":""}">A partita</button></div>
  <div class="wrap"><table><tr><th class="l">Giocatore</th><th class="l">Squadra</th><th>P</th>${K.map(([k,n])=>`<th data-pk="${k}" class="${sk===k?"on":""}">${n}${sk===k?" ↓":""}</th>`).join("")}</tr>
  ${L.map(p=>`<tr><td class="l">${esc(p.n)}</td><td class="l">${esc(p.sq)}</td><td>${p.p}</td>${K.map(([k])=>`<td>${fx(v(p,k))}</td>`).join("")}</tr>`).join("")}</table></div>
  <p class="note">Solo giocatori con almeno 2 presenze, primi 100 per la colonna scelta. P = presenze. Clicca un’intestazione per ordinare.</p>`;
}
function gioc(d,m,a){
  const G=d.espn&&d.espn.giocatori;if(!G||!G.length)return"";
  const top=(t,k,n)=>G.filter(p=>p.sq===t&&p.p>=3&&p[k]>0).sort((x,y)=>y[k]/y.p-x[k]/x.p).slice(0,n);
  const L=[];
  a.picks.filter(p=>p.over&&/^Tiri/.test(p.name)).forEach(p=>{const por=p.name.startsWith("Tiri in porta "),t=p.name.slice(por?14:5),k=por?"sot":"sh";
    top(t,k,2).forEach(x=>L.push(`${esc(x.n)} (${esc(t)}): ${r1(x[k]/x.p)} ${por?"tiri in porta":"tiri"} a partita`));});
  if(a.picks.some(p=>p.over&&p.name.startsWith("Ammon"))||a.fac>=1.12)[m.home,m.away].forEach(t=>top(t,"y",2).forEach(x=>L.push(`${esc(x.n)} (${esc(t)}): ${x.y} gialli in ${x.p} partite, ${r1(x.fc/x.p)} falli fatti a partita`)));
  return L.length?`<b>Giocatori da guardare</b><ul>${L.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
}
function bindExtra(){
  app.querySelectorAll("th[data-pk]").forEach(th=>th.onclick=()=>{st.psort=th.dataset.pk;route();});
  app.querySelectorAll("select[data-pt]").forEach(s=>s.onchange=()=>{st.pteam=s.value;route();});
  app.querySelectorAll("button[data-pg]").forEach(b=>b.onclick=()=>{st.pg=b.dataset.pg==="1";route();});
}
addEventListener("hashchange",route);route();
</script>
