<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f4d33">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcio Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1ee;--ink:#0f1b15;--mute:#5a6b62;--card:#fff;--line:#d3dbd5;--accent:#12804f;--hot:#c2410c;--cold:#1d5fa8;--pitch:#0f4d33;--yel:#f5c400;--cond:"Barlow Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b1510;--ink:#e7efe9;--mute:#8ca095;--card:#13211a;--line:#25382d;--accent:#4fd08f;--hot:#ff9a66;--cold:#7bb8ff;--pitch:#0a3322}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 "Barlow",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--pitch);color:#f3f7f4;flex-wrap:wrap}
header a{color:#f3f7f4;text-decoration:none;font:700 1.55rem var(--cond)}
header a.back{font:600 .85rem "Barlow",sans-serif;border:1px solid rgba(255,255,255,.45);padding:.3rem .85rem;border-radius:999px}
header a.back:hover{border-color:var(--yel)}
header span{margin-left:auto;color:#b9cdbf;font-size:.8rem}
main{max-width:1100px;margin:0 auto;padding:1.25rem}
h1{font:700 clamp(2.6rem,8vw,4.6rem)/1 var(--cond);margin:.4rem 0 1.4rem;letter-spacing:-.01em}
h2{font:700 1.5rem var(--cond);margin:2rem 0 .6rem}
h3{font:700 1.35rem var(--cond)}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.picker a{position:relative;overflow:hidden;min-height:130px;display:flex;align-items:flex-end;padding:1rem 1.1rem;background:var(--pitch);color:#fff;border-radius:6px;text-decoration:none;font:700 2rem/1 var(--cond)}
.picker a::before{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border:2px solid rgba(255,255,255,.2);border-radius:50%}
.picker a::after{content:"";position:absolute;right:35px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.2)}
.picker a:hover,.picker a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
nav.tabs{display:flex;gap:1.4rem;overflow-x:auto;border-bottom:1px solid var(--line);margin:.2rem 0 1rem}
nav.tabs a{padding:.5rem 0;color:var(--mute);text-decoration:none;font:600 1.1rem var(--cond);white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--yel)}
.seg{display:flex;gap:.4rem;margin:.5rem 0;flex-wrap:wrap}
.seg button{padding:.4rem .9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
select{font:inherit;font-size:.9rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:.5rem .7rem;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;font-size:.8rem;color:var(--mute);background:rgba(127,140,132,.08);cursor:pointer;user-select:none}
th.on{color:var(--ink)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500}
.best{color:var(--accent);font-weight:700}.worst{color:var(--hot);font-weight:700}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem}
.leaders div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:.6rem .8rem}
.leaders small{display:block;color:var(--mute)}.leaders b{font:700 1.2rem var(--cond)}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);align-items:center;background:var(--card)}
.res:hover{background:rgba(127,140,132,.08)}
.res:last-child{border-bottom:0}.res .h{text-align:right}
.res .s{font:700 1.35rem/1 var(--cond);background:var(--ink);color:var(--bg);padding:.25rem .65rem;border-radius:4px;letter-spacing:.04em}
.res .m{grid-column:1/-1;color:var(--mute);font-size:.78rem;text-align:center}
.det{padding:.5rem .9rem 1rem;border-bottom:1px solid var(--line);background:var(--card)}.det table{max-width:420px;margin:.4rem auto}.det td{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1rem 1.1rem;margin-bottom:.9rem}
.card h3{margin:0 0 .1rem}.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:600px){.cols{grid-template-columns:1fr}.res{gap:.5rem;padding:.6rem .6rem}}
.card ul{margin:.3rem 0;padding-left:1.1rem}.f{color:var(--accent)}.w{color:var(--hot)}
.pk{border-left:4px solid var(--accent);padding:.25rem 0 .25rem .8rem;margin:.65rem 0}.pk.u{border-color:var(--cold)}
.pk>b{font:700 1.15rem var(--cond)}
.chip{display:inline-block;background:var(--yel);color:#1a1a1a;font-size:.7rem;font-weight:700;padding:.05rem .45rem;border-radius:2px;transform:rotate(-3deg)}
details.card>summary{cursor:pointer;font:700 1.3rem var(--cond)}
.note{color:var(--mute);font-size:.82rem;margin-top:.6rem}
.err{padding:1rem;background:var(--card);border:1px solid var(--hot);border-left-width:4px;border-radius:4px}
.tl{margin:.6rem 0}.tl .lane{position:relative;height:1.7rem}.tl i{position:absolute;transform:translateX(-50%);font-style:normal;cursor:default}
.tl .axis{display:flex;justify-content:space-between;border-top:2px solid var(--line);font-size:.7rem;color:var(--mute)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
details.sub{border-top:1px solid var(--line);padding:.45rem 0}details.sub>summary{cursor:pointer;font:700 1.1rem var(--cond)}details.sub>summary small{color:var(--mute);font:400 .8rem 'Barlow',sans-serif}
.picker a.bol{grid-column:1/-1;background:var(--yel);color:#17210f;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:110px;gap:.2rem}
.picker a.bol small{font:500 .95rem "Barlow",sans-serif}
.picker a.bol::before{border-color:rgba(0,0,0,.18)}.picker a.bol::after{background:rgba(0,0,0,.18)}
.slipitem{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .85rem;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.slipitem input{margin-top:.35rem;width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.slipitem b{font:700 1.1rem var(--cond)}
.slip{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:1rem;padding:.8rem 1rem;background:var(--pitch);color:#fff;border-radius:6px;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.sel{padding:.6rem 0;border-top:1px solid var(--line);flex:1}.sel b{font:700 1.1rem var(--cond)}
.card[data-slip] .tot{margin-top:.6rem;padding:.7rem .9rem;background:var(--pitch);color:#fff;border-radius:4px;font-size:.92rem}
.slipitem .sel{border-top:0;padding:0}
.sumrow{padding:.7rem 0;border-top:1px solid var(--line)}.sumrow:first-child{border-top:0;padding-top:0}.sumrow>b{font:700 1.15rem var(--cond)}
</style>
</head>
<body>
<header><a href="#/" class="back">← Campionati</a><a href="#/">Calcio Stats</a><span id="upd"></span></header>
<main id="app"></main>
<script>
const LEAGUES=[["serie-a","Serie A"],["premier-league","Premier League"],["bundesliga","Bundesliga"],["la-liga","La Liga"],["ligue-1","Ligue 1"]];
// metrica: [chiave, intestazione, descrizione, meglio = "high"|"low"|null]
const COLS=[["gfm","Gol F","Gol fatti a partita","high"],["gam","Gol S","Gol subiti a partita","low"],
["sf","Tiri F","Tiri fatti a partita","high"],["sa","Tiri S","Tiri concessi a partita","low"],
["tf","In porta F","Tiri in porta fatti","high"],["ta","In porta S","Tiri in porta concessi","low"],
["cf","Angoli F","Calci d’angolo fatti","high"],["ca","Angoli S","Calci d’angolo concessi","low"],
["fc","Falli F","Falli fatti","low"],["fs","Falli S","Falli subiti","high"],
["y","Gialli","Gialli presi a partita","low"],["r","Rossi","Rossi presi a partita","low"]];
const app=document.getElementById("app");
const st={sort:"gfm",dir:-1,venue:"tot",cache:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=v=>v==null?"–":v;

async function load(slug){
  if(!st.cache[slug]){const r=await fetch(`data/${slug}.json`,{cache:"no-store"});if(!r.ok)throw new Error("Dati non disponibili");st.cache[slug]=await r.json();}
  return st.cache[slug];
}
function home(){
  document.getElementById("upd").textContent="";
  app.innerHTML=`<h1>Scegli il campionato</h1><div class="picker"><a class="bol" href="#/bolletta">Bolletta<small>Le migliori giocate di tutti i campionati</small></a>${LEAGUES.map(([s,n])=>`<a href="#/${s}/classifica">${n}</a>`).join("")}</div>`;
}
function classifica(d){
  const rows=d.classifica.map((t,i)=>`<tr><td>${i+1}. ${esc(t.squadra)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}:${t.ga}</td><td>${t.gf-t.ga>0?"+":""}${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join("");
  const res=d.ultima_giornata.map(m=>`<div class="res"><span class="h">${esc(m.home)}</span><span class="s">${m.hg} – ${m.ag}</span><span>${esc(m.away)}</span><span class="m">${m.date.split("-").reverse().join("/")}${m.ref?` · arbitro ${esc(m.ref)}`:""}${m.hc!=null?` · angoli ${m.hc}-${m.ac} · tiri ${m.hs}-${m.as_}`:""}</span></div>`).join("");
  return `<h2>Classifica</h2><div class="wrap"><table><tr><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>Gol</th><th>DR</th><th>Pt</th></tr>${rows}</table></div>
  <h2>Ultima giornata giocata</h2><div class="wrap">${res||"<p class='note' style='padding:1rem'>Nessuna partita ancora giocata.</p>"}</div>
  <p class="note">Le partite mostrate sono le ultime ${d.ultima_giornata.length} disputate.</p>`;
}
function squadre(d){
  const names=Object.keys(d.squadre);
  const val=(n,k)=>d.squadre[n][st.venue][k];
  const leaders=COLS.filter(c=>c[3]).map(([k,h,desc,best])=>{
    const ok=names.filter(n=>val(n,k)!=null);if(!ok.length)return"";
    ok.sort((a,b)=>best==="high"?val(b,k)-val(a,k):val(a,k)-val(b,k));
    return `<div><small>${desc}: la migliore</small><b>${esc(ok[0])}</b> ${val(ok[0],k)}</div>`;}).join("");
  const sorted=[...names].sort((a,b)=>st.sort==="nome"?a.localeCompare(b)*-st.dir:((val(a,st.sort)??-1)-(val(b,st.sort)??-1))*st.dir);
  const rank={};COLS.forEach(([k,,,best])=>{if(!best)return;const v=names.map(n=>val(n,k)).filter(x=>x!=null);rank[k]=[Math.min(...v),Math.max(...v)];});
  const cls=(k,v,best)=>{if(v==null||!best)return"";const[mn,mx]=rank[k];if(mn===mx)return"";const g=best==="high"?mx:mn,b=best==="high"?mn:mx;return v===g?"best":v===b?"worst":"";};
  const head=COLS.map(([k,h,desc])=>`<th data-k="${k}" title="${desc}" class="${st.sort===k?"on":""}">${h}${st.sort===k?(st.dir<0?" ↓":" ↑"):""}</th>`).join("");
  const body=sorted.map(n=>`<tr><td>${esc(n)} <small style="color:var(--mute)">(${d.squadre[n][st.venue].p})</small></td>${COLS.map(([k,,,best])=>{const v=val(n,k);return `<td class="${cls(k,v,best)}">${f(v)}</td>`}).join("")}</tr>`).join("");
  const V=[["tot","Totale"],["casa","Casa"],["fuori","Fuori"]];
  return `<h2>Le migliori del campionato</h2><div class="leaders">${leaders}</div>
  <h2>Medie a partita</h2><div class="seg">${V.map(([k,n])=>`<button data-v="${k}" class="${st.venue===k?"on":""}">${n}</button>`).join("")}</div>
  <div class="wrap"><table><tr><th data-k="nome" class="${st.sort==="nome"?"on":""}">Squadra (partite)</th>${head}</tr>${body}</table></div>
  <p class="note">F = fatti, S = subiti/concessi. Verde = miglior valore del campionato, arancione = peggiore. Clicca un’intestazione per ordinare. Con poche partite le medie sono instabili: guarda sempre il numero tra parentesi.</p>`;
}

const TABS=[["prossima","Prossima giornata"],["giocate","Giocate"],["risultati","Risultati"],["giocatori","Giocatori"],["classifica","Classifica"],["squadre","Squadre"]];
function tabs(slug,tab){return `<nav class="tabs">${TABS.map(([k,n])=>`<a href="#/${slug}/${k}" class="${k===tab?"on":""}">${n}</a>`).join("")}</nav>`;}
const lavg=(d,k)=>{const a=Object.values(d.squadre).map(t=>t.tot[k]).filter(x=>x!=null);return a.reduce((s,x)=>s+x,0)/(a.length||1)};
const mix=(x,y)=>(x+y)/2, r1=x=>Math.round(x*10)/10, dt=m=>m.date.split("-").reverse().join("/")+(m.time?" "+m.time:"");
function refOf(slug,m){let v=m.ref||"";try{v=localStorage.getItem(`ref:${slug}:${m.home}:${m.away}`)??v}catch(e){}return v;}
function analyze(d,slug,m){
  const H=d.squadre[m.home]?.tot,A=d.squadre[m.away]?.tot;
  if(!H||!A)return null;
  const ok=Math.min(H.ps,A.ps)>=4,picks=[];
  const add=(name,e,b,x)=>{if(!b)return;const edge=e/b-1;if(Math.abs(edge)>=.12)picks.push({name,e:r1(e),b:r1(b),edge,over:edge>0,strong:Math.abs(edge)>=.2,m,...x});};
  const R=d.arbitri.find(a=>a.arbitro===refOf(slug,m)),by=2*lavg(d,"y");let fac=1;
  if(ok){
    [[m.home,H,A],[m.away,A,H]].forEach(([n,X,Y])=>{
      add(`Tiri ${n}`,mix(X.sf,Y.sa),lavg(d,"sf"));add(`Tiri in porta ${n}`,mix(X.tf,Y.ta),lavg(d,"tf"));
      add(`Angoli ${n}`,mix(X.cf,Y.ca),lavg(d,"cf"));add(`Gol ${n}`,mix(X.gfm,Y.gam),lavg(d,"gfm"));});
    add("Falli totali del match",mix(H.fc,A.fs)+mix(A.fc,H.fs),2*lavg(d,"fc"));
    let ye=H.y+A.y;if(R){const w=R.g/(R.g+3);fac=1+(R.gialli/by-1)*w;ye*=fac;}
    add("Ammonizioni totali del match",ye,by,{ref:R});
  }
  picks.sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge));
  return{H,A,ok,picks,R,fac};
}
const SW=[["gfm","attacco prolifico","attacco poco prolifico",1],["gam","difesa solida","difesa che subisce molto",-1],["sf","tira molto","tira poco",1],["sa","concede pochi tiri","concede molti tiri",-1],["tf","molti tiri in porta","pochi tiri in porta",1],["ta","concede pochi tiri in porta","concede molti tiri in porta",-1],["cf","molti angoli","pochi angoli",1],["ca","concede pochi angoli","concede molti angoli",-1]];
function sw(d,team){const nm=Object.keys(d.squadre),F=[],W=[];
  SW.forEach(([k,s,w,dir])=>{const v=nm.filter(n=>d.squadre[n].tot[k]!=null).sort((a,b)=>(d.squadre[b].tot[k]-d.squadre[a].tot[k])*dir),i=v.indexOf(team);
    if(i<0)return;if(i<3)F.push(`${s} (${i+1}°)`);else if(i>=v.length-3)W.push(`${w} (${v.length-i}° peggiore)`);});
  return{F,W};}
const forma=(d,t)=>d.partite.filter(m=>m.home===t||m.away===t).slice(-5).map(m=>{const g=m.home===t?m.hg-m.ag:m.ag-m.hg;return g>0?"V":g<0?"P":"N"}).join(" ")||"–";
const empty=t=>`<div class="err">${t}</div>`;
function prossima(d,slug){
  if(!d.prossima_giornata?.length)return empty(diag(d));
  return d.prossima_giornata.map(m=>{const a=analyze(d,slug,m);if(!a)return`<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3>Squadre non trovate nei dati.</div>`;
    const sh=sw(d,m.home),sa=sw(d,m.away),li=x=>x.length?x.map(t=>`<li>${t}</li>`).join(""):"<li>nessun dato estremo</li>";
    return `<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3><small>${dt(m)}</small>
    <div class="cols"><div><b>${esc(m.home)}</b> · forma ${forma(d,m.home)}<ul class="f">${li(sh.F)}</ul><ul class="w">${li(sh.W)}</ul></div>
    <div><b>${esc(m.away)}</b> · forma ${forma(d,m.away)}<ul class="f">${li(sa.F)}</ul><ul class="w">${li(sa.W)}</ul></div></div>
    ${quick(d,m)}<b>Come si incontrano</b>${a.ok?(a.picks.filter(p=>!p.name.startsWith("Ammon")).slice(0,3).map(p=>pickLi(p)).join("")||"<p class='note'>Nessuno scontro netto tra punti di forza e di debolezza.</p>"):"<p class='note'>Poche partite per un confronto affidabile.</p>"}</div>`;}).join("")+`<p class="note">Elenco verde = punti di forza (primi 3 del campionato), arancione = punti deboli (ultimi 3). Forma: ultime 5 partite, dalla più vecchia.</p>`;
}
function giocateOld(d,slug){
  if(!d.prossima_giornata?.length)return empty(diag(d));
  const all=d.prossima_giornata.map(m=>({m,a:analyze(d,slug,m)})).filter(x=>x.a);
  const top=all.flatMap(x=>x.a.picks).slice().sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge)).slice(0,8);
  const refs=[...d.arbitri].sort((a,b)=>a.arbitro.localeCompare(b.arbitro));
  const cards=all.map(({m,a})=>{
    const cur=refOf(slug,m),sel=`<select data-ref="${esc(m.home)}|${esc(m.away)}"><option value="">Arbitro non ancora designato</option>${refs.map(r=>`<option ${r.arbitro===cur?"selected":""}>${esc(r.arbitro)}</option>`).join("")}</select>`;
    let note="";
    if(a.R){const hi=a.H.y>=a.A.y?m.home:m.away;
      note=`<p>Arbitro <b>${esc(a.R.arbitro)}</b>: ${a.R.gialli} gialli a partita in ${a.R.g} partite (media campionato ${r1(2*lavg(d,"y"))}).`+
      (a.fac>=1.12?` <b class="w">Arbitro severo</b>: valuta Over ammonizioni sul match; la squadra che ne prende di più è ${esc(hi)}.`:a.fac<=.88?` <b class="f">Arbitro di manica larga</b>: valuta Under ammonizioni.`:" Nessuna spinta netta sulle ammonizioni.")+
      `</p>`;}
    else note=`<p class="note">Scegli l’arbitro per far entrare le ammonizioni nel calcolo (la designazione esce un paio di giorni prima).</p>`;
    return `<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3><small>${dt(m)}</small><p>${sel}</p>${note}${mercati(d,m)}${players(d,m,a)}${a.ok?(a.picks.map(p=>pickLi(p)).join("")||"<p class='note'>Nessuna giocata con scarto netto.</p>"):"<p class='note'>Meno di 4 partite con statistiche per una delle squadre: nessuna giocata.</p>"}</div>`;}).join("");
  return `<p class="note" style="font-size:.95rem"><b>Come si legge.</b> Ogni giocata dice cosa giocare, per esempio “5 o più ammonizioni (Over 4,5)”. Cerca la stessa giocata sul sito del bookmaker: se la quota è uguale o più alta di quella minima indicata conviene, se è più bassa lascia perdere.</p><h2>Le giocate più nette della giornata</h2><div class="card">${top.map(p=>pickLi(p,1)).join("")||"Nessuna giocata con scarto netto."}</div><h2>Partita per partita</h2>${cards}
  <p class="note">La stima mescola quanto la squadra (o il giocatore) fa di solito e quanto l’avversaria concede. La probabilità si calcola con un modello statistico semplice sui dati della stagione: è un’indicazione, non una certezza, e con poche partite è molto incerta. La quota minima è il confine di convenienza: sotto quella quota il bookmaker ti paga meno del rischio. I dati dei giocatori contano solo chi gioca spesso (almeno 4 presenze e il 60% delle partite della squadra).</p>`;
}
function risultatiOld(d){
  if(!d.ultima_giornata.length)return empty("Nessuna partita ancora giocata.");
  const row=(l,a,b)=>`<tr><td>${a??"–"}</td><td>${l}</td><td>${b??"–"}</td></tr>`;

    PL.forEach(x=>cand.push({fam:"G:"+x.c,label:`${esc(x.n)} (${esc(x.sq)}): ${x.txt}`,pr:x.pr,why:x.why}));
    const cnt={},best=cand.filter(x=>x.pr>=.5&&x.pr<=.8).sort((x,y)=>y.pr-x.pr).filter(x=>(cnt[x.fam]=(cnt[x.fam]||0)+1)<=2).slice(0,6);
    const mk=M?FAMS.map(f=>{const L=M.mk.filter(x=>x.fam===f).sort((x,y)=>y.pr-x.pr);
      return sec(f,L.length,`<div class="wrap" style="margin:.4rem 0"><table><tr><th class="l">Mercato</th><th>Prob.</th><th>Quota min.</th></tr>${L.map(x=>`<tr><td class="l">${esc(x.label)}</td><td>${Math.round(x.pr*100)}%</td><td>${fm(1/x.pr,2)}</td></tr>`).join("")}</table></div>`)}).join(""):"";
    const tp=a.ok?a.picks:[],isM=p=>/^(Falli|Ammon)/.test(p.name);
    const teams=sec("Squadre: tiri, angoli e gol",tp.filter(p=>!isM(p)).length,tp.filter(p=>!isM(p)).map(p=>{const i=pickInfo(p);return lineHtml(esc(i.label),i.pr,"",`stima ${fm(p.e)} contro media ${fm(p.b)}`)}).join(""));
    const fa=sec("Falli e ammonizioni del match",tp.filter(isM).length,tp.filter(isM).map(p=>{const i=pickInfo(p);return lineHtml(esc(i.label),i.pr,"",`stima ${fm(p.e)} contro media ${fm(p.b)}`)}).join(""));
    const pls=PCAT.map(([c,t])=>{const L=PL.filter(x=>x.c===c).sort((x,y)=>y.pr-x.pr).slice(0,6);return sec(t,L.length,L.map(x=>lineHtml(`${esc(x.n)} (${esc(x.sq)}): ${x.txt}`,x.pr,"",esc(x.why))).join(""));}).join("");
    return `<div class="card"><h3>${esc(m.home)} – ${esc(m.away)}</h3><small>${dt(m)}</small><p>${sel}</p>${note}
    ${M?`<p><small>Gol attesi: ${esc(m.home)} ${fm(M.lh)} – ${fm(M.la)} ${esc(m.away)} · 1 ${M.r[0]}% · X ${M.r[1]}% · 2 ${M.r[2]}% · risultati più probabili: ${M.top.join(", ")}</small></p>`:""}
    <h4 style="margin:.9rem 0 .2rem">Migliori giocate</h4>${best.map(x=>lineHtml(x.label,x.pr,"",x.why?esc(x.why):"")).join("")||"<p class='note'>Nessuna giocata nella fascia 50–80% di probabilità.</p>"}
    <div class="subs"><p class="note" style="margin:.8rem 0 .2rem">Tutte le altre giocate, per tipo (tocca per aprire):</p>${mk}${teams}${fa}${pls}</div></div>`;}).join("");
  return `<p class="note" style="font-size:.95rem"><b>Come si legge.</b> Per ogni partita trovi in alto le migliori giocate, poi le altre divise per tipo da aprire con un tocco. Cerca la stessa giocata sul sito del bookmaker: se la quota è uguale o più alta di quella minima indicata conviene, se è più bassa lascia perdere.</p><h2>Le migliori giocate, partita per partita</h2><div class="card">${d.prossima_giornata.map(m=>{const B=bestOf(d,slug,m).slice(0,3);return B.length?`<div class="sumrow"><b>${esc(m.home)} – ${esc(m.away)}</b> <small>${dt(m)}</small>${B.map(x=>`<div class="pk"><b>${x.label}</b><br><small>probabilità ${Math.round(x.pr*100)}% · quota minima ${fm(1/x.pr,2)}</small></div>`).join("")}</div>`:""}).join("")||"<p class='note'>Nessuna giocata nella fascia 50–80% di probabilità.</p>"}</div><h2>Dettaglio di ogni partita</h2>${cards}
  <p class="note">Le migliori giocate sono quelle con probabilità stimata tra il 50% e l’80%: sopra l’80% le quote sono troppo basse per contare. Le probabilità vengono da un modello statistico semplice sui dati della stagione: sono un’indicazione, non una certezza, e con poche partite sono molto incerte. Per i giocatori contano solo quelli che giocano spesso (almeno 4 presenze e il 60% delle partite della squadra).</p>`;
}

function human(fam,l,m){
  const cap=s=>s[0].toUpperCase()+s.slice(1),T=c=>c==="1"?`vince ${m.home}`:c==="2"?`vince ${m.away}`:c==="X"?"pareggio":c==="1X"?`${m.home} non perde`:c==="X2"?`${m.away} non perde`:"non finisce in pareggio";
  const G=s=>{if(s==="GG")return"segnano entrambe";if(s==="NG")return"almeno una squadra non segna";const x=/^(Over|Under) (\d),5$/.exec(s);return x?(x[1]==="Over"?`almeno ${+x[2]+1} gol`:`al massimo ${x[2]} gol`):s};
  let x;
  if(fam==="Esito 1X2"||fam==="Doppia chance"){const c=l.split(" ")[0];return `${cap(T(c))} (${c})`}
  if(fam==="Over/Under e GG/NG")return /^(GG|NG)$/.test(l)?`${cap(G(l))} (${l})`:`${cap(G(l))} nel match (${l})`;
  if(/\+ gol$/.test(fam)){const[c,...r]=l.split(" + ");return `${cap(T(c))} e ${G(r.join(" + "))} (${l})`}
  if(fam==="Multigol"){x=/(\d)-(\d)/.exec(l);return `Tra ${x[1]} e ${x[2]} gol nel match (Multigol ${x[1]}-${x[2]})`}
  if(fam==="Multigol squadra"){x=/^Multigol (.+) (\d)-(\d)$/.exec(l);return x?`${x[1]} segna tra ${x[2]} e ${x[3]} gol (Multigol ${x[2]}-${x[3]})`:l}
  if(fam==="Multigol tempo"){x=/^Multigol (1T|2T) (\d)-(\d)$/.exec(l);return x?`Tra ${x[2]} e ${x[3]} gol nel ${x[1]==="1T"?"primo":"secondo"} tempo (Multigol ${x[2]}-${x[3]})`:l}
  if(fam==="Esito per tempo"){x=/^(\w) nel (1T|2T)$/.exec(l);if(!x)return l;const t=x[2]==="1T"?"primo":"secondo";return x[1]==="X"?`Pareggio nel ${t} tempo`:`${cap(T(x[1]))} nel ${t} tempo`}
  if(fam==="Almeno un tempo"){const c=l[0];return c==="X"?"Almeno un tempo finisce in pareggio":`${c==="1"?m.home:m.away} vince almeno un tempo`}
  return l;
}
function bestOf(d,slug,m,all){
  const a=analyze(d,slug,m);if(!a)return[];
  const M=model(d,m),cand=[],C=(fam,raw,pr,why)=>cand.push({fam,raw,label:esc(raw),pr,why,mk:slug+"|"+m.home+"|"+m.away});
  if(M)M.mk.forEach(x=>C(x.fam,human(x.fam,x.label,m),x.pr));
  if(a.ok)a.picks.forEach(p=>{const i=pickInfo(p);C("Squadre",i.label,i.pr)});
  playerList(d,m,a).forEach(x=>C("G:"+x.c,`${x.n} (${x.sq}): ${x.txt}`,x.pr,x.why));
  const cnt={};return cand.filter(x=>x.pr>=.5&&x.pr<=.8).sort((x,y)=>y.pr-x.pr).filter(x=>(cnt[x.fam]=(cnt[x.fam]||0)+1)<=(all?4:2)).slice(0,all?60:6);
}
const qGet=id=>{try{return localStorage.getItem("q:"+id)||""}catch(e){return""}};
const qSet=(id,v)=>{try{localStorage.setItem("q:"+id,v)}catch(e){}};
const parseQ=s=>{const x=parseFloat(String(s).replace(",","."));return x>1?x:NaN};
function selHtml(x){
  return `<div class="sel" data-pr="${x.pr}" data-min="${1/x.pr}"><b>${x.label}</b><br><small>${esc(x.lg)} · ${esc(x.m.home)}–${esc(x.m.away)} · ${dt(x.m)} · probabilità ${Math.round(x.pr*100)}% · quota minima ${fm(1/x.pr,2)}${x.why?" · "+esc(x.why):""}</small><br><label><small>Quota del bookmaker: </small><input data-q="${esc(x.id)}" inputmode="decimal" placeholder="es. 1,45" value="${esc(qGet(x.id))}" style="width:5.5rem;font:inherit;padding:.2rem .4rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)"></label> <small class="verd"></small></div>`;
}
function sumHtml(sels){
  if(!sels.length)return"Seleziona le giocate per comporre la bolletta.";
  const p=sels.reduce((s,x)=>s*parseFloat(x.dataset.pr),1),qs=sels.map(x=>parseQ(x.querySelector("input[data-q]").value));
  let t=`<b>${sels.length} ${sels.length===1?"selezione":"selezioni"}</b> · probabilità che si avverino tutte ${Math.round(p*100)}% · quota totale minima per convenire <b>${fm(1/p,2)}</b>`;
  if(qs.every(q=>!isNaN(q))){const Q=qs.reduce((s,q)=>s*q,1),ev=p*Q-1;t+=`<br>Con le quote inserite la quota totale è <b>${fm(Q,2)}</b>: secondo la stima ${ev>=0?"conviene":"non conviene"} (valore atteso ${ev>=0?"+":""}${fm(ev*100,0)}% su ciò che giochi).`;}
  return t;
}
function refresh(){
  app.querySelectorAll(".sel").forEach(s=>{const q=parseQ(s.querySelector("input[data-q]").value),min=parseFloat(s.dataset.min),v=s.querySelector(".verd");
    v.textContent=isNaN(q)?"":q>=min?`✓ Conviene: la quota supera il minimo (${fm(min,2)})`:`✗ Non conviene: servirebbe almeno ${fm(min,2)}`;v.style.color=isNaN(q)?"":q>=min?"var(--accent)":"var(--hot)";});
  app.querySelectorAll("[data-slip]").forEach(c=>{c.querySelector(".tot").innerHTML=sumHtml([...c.querySelectorAll(".sel")]);});
  const chk=[...app.querySelectorAll("input[data-k]")].filter(i=>i.checked).map(i=>i.closest(".slipitem").querySelector(".sel")),el=document.getElementById("slip");
  if(el){el.style.display=chk.length?"":"none";el.innerHTML=sumHtml(chk);}
}
async function bolletta(){
  document.getElementById("upd").textContent="";
  app.innerHTML=`<h1>Bolletta</h1><p class="note">Calcolo le migliori giocate di tutti i campionati…</p>`;
  const pool=[],miss=[];
  await Promise.all(LEAGUES.map(async([slug,name])=>{try{
    const d=await load(slug),E=await loadE(slug);d.espn=E;if(E&&E.prossima&&E.prossima.length)d.prossima_giornata=E.prossima;
    (d.prossima_giornata||[]).forEach(m=>bestOf(d,slug,m,true).forEach(x=>pool.push({...x,lg:name,m,id:slug+"|"+m.home+"|"+m.away+"|"+x.raw})));
  }catch(e){miss.push(name)}}));
  if(!pool.length){app.innerHTML=`<h1>Bolletta</h1>${empty("Nessuna giocata disponibile: servono i dati delle prossime partite. Controlla che “Aggiorna dati” su GitHub sia andato a buon fine.")}`;return;}
  const used=new Set(),build=(n,lo,hi)=>{
    const pick=excl=>{const by={};pool.filter(x=>x.pr>=lo&&x.pr<=hi&&!(excl&&used.has(x.mk))).forEach(x=>{const b=by[x.mk];if(!b||x.pr>b.pr)by[x.mk]=x});
      const out=[],fc={};Object.values(by).sort((a,b)=>b.pr-a.pr).forEach(x=>{if(out.length<n&&(fc[x.fam]||0)<2){fc[x.fam]=(fc[x.fam]||0)+1;out.push(x)}});return out;};
    let o=pick(true);if(o.length<n)o=pick(false);o.forEach(x=>used.add(x.mk));return o;};
  const S=[["Bolletta sicura","3 giocate molto probabili, da partite diverse.",build(3,.70,.80)],["Bolletta equilibrata","4 giocate di probabilità media, da partite diverse.",build(4,.60,.699)],["Bolletta più rischiosa","3 giocate meno probabili: la quota è più alta, ma si avverano meno spesso.",build(3,.50,.599)]].filter(s=>s[2].length);
  const cnt={},list=[...pool].sort((a,b)=>b.pr-a.pr).filter(x=>(cnt[x.mk]=(cnt[x.mk]||0)+1)<=2).slice(0,40);
  app.innerHTML=`<h1>Bolletta</h1>
  <p class="note" style="font-size:.95rem">Tre bollette pronte, ognuna con una sola giocata per partita, scelte tra le prossime partite di tutti i campionati. Scrivi accanto a ogni giocata la quota che vedi dal bookmaker: ti dico subito se conviene. Più giocate metti insieme, più la probabilità che si avverino tutte scende: 4 giocate al 75% insieme sono circa il 32%.</p>
  ${S.map(([t,ds,L])=>`<div class="card" data-slip><h3>${t}</h3><small>${ds}</small>${L.map(selHtml).join("")}<div class="tot"></div></div>`).join("")}
  <details class="card"><summary>Componi la tua bolletta (le giocate più probabili)</summary>${list.map(x=>`<div class="slipitem"><input type="checkbox" data-k="${esc(x.mk)}">${selHtml(x)}</div>`).join("")}</details>
  <div class="slip" id="slip" style="display:none"></div>
  <p class="note">${miss.length?`Campionati non caricati: ${miss.join(", ")}. `:""}Sono stime statistiche, non certezze: confronta sempre con la quota reale del bookmaker. Le quote che scrivi restano salvate solo su questo browser.</p>`;
  app.querySelectorAll("input[data-q]").forEach(i=>i.oninput=()=>{qSet(i.dataset.q,i.value);app.querySelectorAll("input[data-q]").forEach(o=>{if(o!==i&&o.dataset.q===i.dataset.q)o.value=i.value});refresh();});
  app.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{if(i.checked)app.querySelectorAll("input[data-k]").forEach(o=>{if(o!==i&&o.dataset.k===i.dataset.k)o.checked=false});refresh();});
  refresh();
}
function bindExtra(){
  app.querySelectorAll("th[data-pk]").forEach(th=>th.onclick=()=>{st.psort=th.dataset.pk;route();});
  app.querySelectorAll("select[data-pt]").forEach(s=>s.onchange=()=>{st.pteam=s.value;route();});
  app.querySelectorAll("button[data-pg]").forEach(b=>b.onclick=()=>{st.pg=b.dataset.pg==="1";route();});
}
addEventListener("hashchange",route);route();
</script>
